<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Ground Shadow -->
    <radialGradient id="ambientShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#ff6b00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Top Facet Gradients -->
    <linearGradient id="cyanTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cyanTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Side Facet Gradients (Cyan to Ocean Teal) -->
    <linearGradient id="cyanSideLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="cyanSideRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Sunset Coral Gradients for Stems -->
    <linearGradient id="sunsetStemLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="sunsetStemRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Ampersand 3D Gradients -->
    <linearGradient id="ampersandTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="ampersandBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ff6b00" />
    </linearGradient>

    <linearGradient id="ampersandBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8f3d" />
      <stop offset="60%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="256" cy="360" rx="170" ry="46" fill="url(#ambientShadow)" />

  <!-- ===================================================================
       ISOMETRIC MONOGRAM: TWO "T" PRISMS & INTERLOCKING AMPERSAND "&"
       =================================================================== -->
  <g id="isometric-monogram" transform="translate(0, -10)">

    <!-- BACK LEFT T-STEM (Sunset orange-coral vertical column) -->
    <g id="left-t-stem">
      <!-- Front-Left Face -->
      <path d="M 172 170 L 212 192 L 212 284 L 172 262 Z" fill="url(#sunsetStemLeft)" />
      <!-- Front-Right Face -->
      <path d="M 212 192 L 232 180 L 232 272 L 212 284 Z" fill="#c2410c" />
    </g>

    <!-- BACK RIGHT T-STEM (Sunset orange-coral vertical column) -->
    <g id="right-t-stem">
      <!-- Front-Left Face -->
      <path d="M 280 180 L 300 192 L 300 284 L 280 272 Z" fill="#ea580c" />
      <!-- Front-Right Face -->
      <path d="M 300 192 L 340 170 L 340 262 L 300 284 Z" fill="url(#sunsetStemRight)" />
    </g>

    <!-- LEFT "T" CROSSBAR (Prism angled up to center peak) -->
    <g id="left-t-crossbar">
      <!-- Top Surface -->
      <polygon points="130,172 214,124 250,144 166,192" fill="url(#cyanTopLeft)" />
      <!-- Left Outer Face -->
      <polygon points="130,172 166,192 166,220 130,200" fill="url(#cyanSideLeft)" />
      <!-- Front Underside / Inner Face -->
      <polygon points="166,192 250,144 250,172 166,220" fill="url(#cyanSideRight)" />
    </g>

    <!-- RIGHT "T" CROSSBAR (Prism angled up to center peak) -->
    <g id="right-t-crossbar">
      <!-- Top Surface -->
      <polygon points="262,144 298,124 382,172 346,192" fill="url(#cyanTopRight)" />
      <!-- Right Outer Face -->
      <polygon points="346,192 382,172 382,200 346,220" fill="url(#cyanSideRight)" />
      <!-- Front Underside / Inner Face -->
      <polygon points="262,144 346,192 346,220 262,172" fill="url(#cyanSideLeft)" />
    </g>

    <!-- INTERLOCKING CENTRAL AMPERSAND "&" (Smooth 3D Torus Ribbon) -->
    <g id="ampersand-interlock">
      <!-- Bottom Outer Ribbon Loop (Warm Coral) -->
      <path d="M 226 250 C 206 270 206 312 238 328 C 274 344 316 318 316 286 C 316 262 296 244 274 234 Z" 
            fill="url(#ampersandBottom)" />
      
      <!-- Bottom Inner Cutout (Shadow depth) -->
      <path d="M 238 274 C 230 286 232 304 246 312 C 262 320 284 310 286 294 C 288 280 274 268 258 264 Z" 
            fill="#991b1b" opacity="0.35" />

      <!-- Upper Loop (Electric Cyan to Coral transition) -->
      <path d="M 274 234 C 256 226 234 204 234 180 C 234 154 254 138 274 150 C 294 162 300 188 284 212 L 324 254 C 334 264 340 276 340 282 L 308 300 L 274 234 Z" 
            fill="url(#ampersandBody)" />

      <!-- Top Loop Highlight Cap -->
      <ellipse cx="266" cy="172" rx="18" ry="24" transform="rotate(-25 266 172)" fill="url(#ampersandTop)" />
      <ellipse cx="266" cy="172" rx="8" ry="12" transform="rotate(-25 266 172)" fill="#0369a1" opacity="0.8" />
    </g>

    <!-- High-Precision Chamfer Highlights -->
    <line x1="130" y1="172" x2="214" y2="124" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="298" y1="124" x2="382" y2="172" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="166" y1="192" x2="250" y2="144" stroke="#e0f2fe" stroke-width="1.8" opacity="0.5" />
    <line x1="262" y1="144" x2="346" y2="192" stroke="#e0f2fe" stroke-width="1.8" opacity="0.5" />
  </g>

  <!-- ===================================================================
       MODERN SLEEK GEOMETRIC TYPOGRAPHY: "T&T 3D STUDIO"
       =================================================================== -->
  <g id="brand-typography" transform="translate(0, 10)">
    <!-- Primary Bold Monogram Text: T&T -->
    <text x="256" y="420" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="46" 
          letter-spacing="2" 
          fill="#ffffff">
      T<tspan fill="#00f0ff">&amp;</tspan>T
    </text>

    <!-- Subtitle: 3D STUDIO -->
    <text x="256" y="460" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Space Grotesk', -apple-system, sans-serif" 
          font-weight="700" 
          font-size="20" 
          letter-spacing="8" 
          fill="#ff6b00">
      3D STUDIO
    </text>
  </g>
</svg>
