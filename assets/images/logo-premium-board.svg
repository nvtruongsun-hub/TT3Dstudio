<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Đề xuất nhận diện logo T&amp;T 3D Studio</title>
  <desc id="desc">Bảng trình bày logo tối giản cho nền sáng và nền tối, cùng biểu tượng và bảng màu.</desc>
  <defs>
    <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33 4 59 19v30L33 64 7 49V19L33 4Z" stroke="currentColor" stroke-width="2.7"/>
      <path d="m7 19 26 15 26-15M33 34v30" stroke="currentColor" stroke-width="2.7"/>
      <path d="m7 19 26 15" stroke="#B66D50" stroke-width="2.7"/>
    </g>
    <g id="light-logo">
      <use href="#mark" x="0" y="0" color="#34483E"/>
      <text x="78" y="47" fill="#252A26" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="600" letter-spacing="-2.5">T<tspan fill="#B66D50">&amp;</tspan>T</text>
      <text x="174" y="39" fill="#667068" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">3D STUDIO</text>
    </g>
    <g id="dark-logo">
      <use href="#mark" x="0" y="0" color="#E9E7DF"/>
      <path d="m7 19 26 15" stroke="#D08A69" stroke-width="2.7" stroke-linecap="round"/>
      <text x="78" y="47" fill="#F5F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="600" letter-spacing="-2.5">T<tspan fill="#D08A69">&amp;</tspan>T</text>
      <text x="174" y="39" fill="#C1C5BF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">3D STUDIO</text>
    </g>
  </defs>
  <rect width="1200" height="800" fill="#F5F2EB"/>
  <text x="72" y="86" fill="#252A26" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">T&amp;T 3D STUDIO</text>
  <text x="72" y="126" fill="#252A26" font-family="Georgia, 'Times New Roman', serif" font-size="34">Đề xuất logo tối giản</text>
  <text x="72" y="158" fill="#667068" font-family="Arial, Helvetica, sans-serif" font-size="15">Khối hình học gợi công nghệ 3D · chữ serif tạo nét thủ công và cao cấp</text>

  <rect x="72" y="205" width="1056" height="250" rx="18" fill="#FFFEFB" stroke="#E3DED4"/>
  <text x="104" y="244" fill="#858A82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PHIÊN BẢN NỀN SÁNG</text>
  <g transform="translate(150 275) scale(1.55)"><use href="#light-logo"/></g>

  <rect x="72" y="483" width="1056" height="190" rx="18" fill="#252A26"/>
  <text x="104" y="522" fill="#AEB4AC" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PHIÊN BẢN NỀN TỐI</text>
  <g transform="translate(150 548) scale(1.18)"><use href="#dark-logo"/></g>

  <text x="72" y="724" fill="#667068" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">BẢNG MÀU</text>
  <rect x="190" y="704" width="24" height="24" rx="6" fill="#34483E"/><text x="224" y="722" fill="#4A514A" font-family="Arial, Helvetica, sans-serif" font-size="13">Rêu đậm</text>
  <rect x="325" y="704" width="24" height="24" rx="6" fill="#B66D50"/><text x="359" y="722" fill="#4A514A" font-family="Arial, Helvetica, sans-serif" font-size="13">Đất nung</text>
  <rect x="461" y="704" width="24" height="24" rx="6" fill="#F5F2EB" stroke="#D5D0C6"/><text x="495" y="722" fill="#4A514A" font-family="Arial, Helvetica, sans-serif" font-size="13">Kem ấm</text>
  <rect x="590" y="704" width="24" height="24" rx="6" fill="#252A26"/><text x="624" y="722" fill="#4A514A" font-family="Arial, Helvetica, sans-serif" font-size="13">Than chì</text>
</svg>
