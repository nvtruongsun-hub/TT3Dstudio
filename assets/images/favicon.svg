<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Cyan Top Facet Gradients -->
    <linearGradient id="favCyanTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="favCyanTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Side Facet Gradients -->
    <linearGradient id="favCyanSideLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="favCyanSideRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Sunset Coral Gradients for Stems -->
    <linearGradient id="favSunsetStemLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="favSunsetStemRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Ampersand 3D Gradients -->
    <linearGradient id="favAmpersandBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ff6b00" />
    </linearGradient>

    <linearGradient id="favAmpersandBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8f3d" />
      <stop offset="60%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <g transform="translate(0, -12) scale(0.96) translate(5, 5)">
    <!-- LEFT T-STEM -->
    <path d="M 62 80 L 102 102 L 102 194 L 62 172 Z" fill="url(#favSunsetStemLeft)" />
    <path d="M 102 102 L 122 90 L 122 182 L 102 194 Z" fill="#c2410c" />

    <!-- RIGHT T-STEM -->
    <path d="M 148 90 L 168 102 L 168 194 L 148 182 Z" fill="#ea580c" />
    <path d="M 168 102 L 208 80 L 208 172 L 168 194 Z" fill="url(#favSunsetStemRight)" />

    <!-- LEFT "T" CROSSBAR -->
    <polygon points="20,82 104,34 140,54 56,102" fill="url(#favCyanTopLeft)" />
    <polygon points="20,82 56,102 56,130 20,110" fill="url(#favCyanSideLeft)" />
    <polygon points="56,102 140,54 140,82 56,130" fill="url(#favCyanSideRight)" />

    <!-- RIGHT "T" CROSSBAR -->
    <polygon points="152,54 188,34 272,82 236,102" fill="url(#favCyanTopRight)" />
    <polygon points="236,102 272,82 272,110 236,130" fill="url(#favCyanSideRight)" />
    <polygon points="152,54 236,102 236,130 152,82" fill="url(#favCyanSideLeft)" />

    <!-- INTERLOCKING AMPERSAND "&" -->
    <path d="M 116 160 C 96 180 96 222 128 238 C 164 254 206 228 206 196 C 206 172 186 154 164 144 Z" fill="url(#favAmpersandBottom)" />
    <path d="M 128 184 C 120 196 122 214 136 222 C 152 230 174 220 176 204 C 178 190 164 178 148 174 Z" fill="#991b1b" opacity="0.35" />
    <path d="M 164 144 C 146 136 124 114 124 90 C 124 64 144 48 164 60 C 184 72 190 98 174 122 L 214 164 C 224 174 230 186 230 192 L 198 210 L 164 144 Z" fill="url(#favAmpersandBody)" />
    <ellipse cx="156" cy="82" rx="18" ry="24" transform="rotate(-25 156 82)" fill="#38bdf8" />
    <ellipse cx="156" cy="82" rx="8" ry="12" transform="rotate(-25 156 82)" fill="#0369a1" opacity="0.8" />
  </g>
</svg>
